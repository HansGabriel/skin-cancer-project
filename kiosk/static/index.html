<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>E.P.I.V.U.E. — skin check</title>
<link rel="stylesheet" href="/static/kiosk.css">
</head>
<body>
<!-- Two bands, from the EPIVUE Interface design: the instrument (dark, the aperture and
     the five nav keys) and the page (white, one job per screen). Every size is
     clamp(min, N·container-height, max), so 1024x600 and 1440x900 both fill; under
     720 px wide the bands stack and the nav moves to the bottom. -->
<main class="app" id="app" data-screen="home" data-tone="" data-camera="off" data-source="camera">

  <section class="instrument" aria-label="Camera view">
    <div class="glow" aria-hidden="true"></div>
    <header class="inst-head">
      <div class="brand"><span class="brand-dot"></span><span>E.P.I.V.U.E.</span></div>
      <div class="inst-meta"><span id="clock" class="clock"></span><span class="offline">OFFLINE</span></div>
    </header>

    <div class="field">
      <div class="aperture" id="aperture">
        <svg class="ap-svg" viewBox="-2 -2 104 104" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="#0B1220"/>
          <circle class="rest-ring" cx="50" cy="50" r="28" fill="none" stroke="#3DDBD9" stroke-width=".4" stroke-dasharray="1.4 3" opacity=".35"/>
        </svg>
        <div class="photo">
          <img id="field" alt="" draggable="false">
          <video id="webcam" autoplay playsinline muted></video>
        </div>
        <svg class="ap-svg ap-over" viewBox="-2 -2 104 104" aria-hidden="true">
          <g class="reticle">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#3DDBD9" stroke-width="1.4" opacity=".6"/>
            <path d="M50 11V6M89 50h5M50 89v5M11 50H6" stroke="#3DDBD9" stroke-width="1" opacity=".85"/>
          </g>
          <g class="spinner"><path d="M 50 4.5 A 45.5 45.5 0 0 1 82.17 17.83" fill="none" stroke="#3DDBD9" stroke-width="2.6" stroke-linecap="round"/></g>
          <g class="arcs" id="arcs">
            <path data-sign="A" d="M 52.20 8.06 A 42 42 0 0 1 89.21 34.95"/>
            <path data-sign="B" d="M 90.57 39.13 A 42 42 0 0 1 76.43 82.64"/>
            <path data-sign="C" d="M 72.87 85.22 A 42 42 0 0 1 27.13 85.22"/>
            <path data-sign="D" d="M 23.57 82.64 A 42 42 0 0 1 9.43 39.13"/>
            <path data-sign="E" d="M 10.79 34.95 A 42 42 0 0 1 47.80 8.06"/>
            <text x="70.87" y="21.28">A</text><text x="83.76" y="60.97">B</text><text x="50" y="85.5">C</text>
            <text x="16.24" y="60.97">D</text><text x="29.13" y="21.28">E</text>
          </g>
          <circle class="verdict-ring" cx="50" cy="50" r="47.5" fill="none" stroke-width="3"/>
        </svg>
        <div class="ap-rest" id="ap-rest">Put the spot inside the ring</div>
        <div class="ap-chip ap-live"><span class="pulse"></span>LIVE</div>
        <div class="ap-chip ap-imported"><span></span>IMPORTED PHOTO</div>
        <div class="ap-reading">READING</div>
      </div>

      <div class="caption">
        <div class="cap-abcde">
          <div class="cap-title">A B C D E · THE FIVE THINGS DOCTORS LOOK AT</div>
          <div class="legend">
            <span><i style="background:#8C9BB0"></i>Normal</span>
            <span><i style="background:#C79A6B"></i>Borderline</span>
            <span><i style="background:#E0645A"></i>Stands out</span>
            <span><i style="background:#7E9BD0"></i>Not measured</span>
            <span><i style="background:#3DDBD9"></i>History</span>
          </div>
        </div>
        <div class="cap-saved"><div class="cap-title" id="cap-saved-title"></div><div class="dots" id="cap-dots"></div></div>
        <div class="cap-standby cap-title" id="cap-standby">READY · ON-DEVICE MODEL</div>
      </div>
    </div>
  </section>

  <nav class="nav" aria-label="Sections">
    <button type="button" data-go="home">Home</button>
    <button type="button" data-go="frame">New check</button>
    <button type="button" data-go="saved">Saved</button>
    <button type="button" data-go="questions">Questions</button>
    <button type="button" data-go="settings">Settings</button>
  </nav>

  <section class="page">
    <div class="screen" id="screen"></div>
    <footer class="strip">
      <span class="strip-k">NOT A DIAGNOSIS</span>
      <span class="strip-t">An educational screening aid. Always contact a qualified health professional.</span>
    </footer>
    <div class="overlay staff" id="staff" hidden></div>
    <div class="overlay sheet" id="sheet" hidden></div>
  </section>
</main>

<input type="file" id="file" accept="image/*" hidden>
<canvas id="canvas" hidden></canvas>
<script src="/static/kiosk.js"></script>
</body>
</html>
