# The Streamlit fallback page (cloud/streamlit_app.py) on Streamlit Cloud. Railway and the kiosk do not use Streamlit.
[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 8

[theme]
base = "light"
primaryColor = "#16233A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#131A22"
